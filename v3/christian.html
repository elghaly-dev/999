<title>Satar</title>
<meta name="theme-color" content="#07080d">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="manifest" href="christian.webmanifest">

<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">

<style>
  :root {
    color-scheme: dark;
    --night: #07080d;
    --night-2: #0b0d17;
    --panel: #101322;
    --ivory: #ece4d1;
    --ivory-dim: #b9b2a0;
    --ivory-faint: #8b8574;
    --gold: #d4af5a;
    --gold-deep: #a9853c;
    --gold-hair: rgba(212, 175, 90, 0.34);
    --violet: #9a7bff;
    --violet-deep: #5b3df0;
    --danger: #ff7a66;
    --danger-bg: rgba(229, 72, 77, 0.12);
    --safe: #63cf96;
    --safe-bg: rgba(63, 178, 127, 0.12);
    --serif: "Cormorant Garamond", "Times New Roman", serif;
    --caps: "Marcellus", "Cormorant Garamond", serif;
    --sans: "Jost", "Segoe UI", system-ui, sans-serif;
    --ar: "Amiri", serif;
  }
  * { box-sizing: border-box; }
  ::selection { background: rgba(212, 175, 90, 0.35); color: #fff; }
  body { max-width: 660px; margin: 0 auto; padding: 16px; line-height: 1.65; font-family: var(--sans); font-weight: 300; color: var(--ivory); -webkit-font-smoothing: antialiased;
    background: radial-gradient(1100px 700px at 50% -10%, rgba(91, 61, 240, 0.16), transparent 60%),
      radial-gradient(900px 600px at 85% 38%, rgba(212, 175, 90, 0.05), transparent 55%),
      var(--night); background-attachment: fixed; }
  html[lang="ar"] body { font-family: var(--ar), var(--sans); }
  a { color: var(--gold); }
  h1 { font-family: var(--caps); font-weight: 400; font-size: 2.6rem; letter-spacing: 0.34em; text-indent: 0.34em; text-transform: uppercase; line-height: 1; margin: 16px 0 0; text-align: center; color: var(--ivory); }
  .sub { font-family: var(--serif); font-style: italic; font-size: 1.3rem; line-height: 1.35; color: var(--ivory-dim); text-align: center; margin: 14px auto 0; max-width: 34ch; }
  html[lang="ar"] .sub { font-family: var(--ar); font-style: normal; }
  .emblem { position: relative; width: 120px; height: 120px; margin: 8px auto 0; }
  .emblem::before { content: ""; position: absolute; inset: 6% 10%; border-radius: 50%; background: radial-gradient(circle, rgba(122, 92, 255, 0.4), rgba(91, 61, 240, 0.12) 55%, transparent 72%); filter: blur(14px); }
  .emblem img { position: relative; width: 100%; height: 100%; display: block; border-radius: 50%; -webkit-mask-image: radial-gradient(circle, #000 62%, transparent 71%); mask-image: radial-gradient(circle, #000 62%, transparent 71%); }
  button { font-family: var(--sans); font-size: 1rem; font-weight: 400; letter-spacing: 0.04em; padding: 10px 20px; border-radius: 999px; border: 1px solid var(--gold); background: transparent; color: var(--gold); cursor: pointer; margin: 8px 8px 8px 0; transition: background 0.3s, color 0.3s, border-color 0.3s; }
  button:hover { background: var(--gold); color: #0a0a08; }
  button:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }
  button.small { font-size: 0.9rem; padding: 6px 14px; }
  .langbar { text-align: center; margin: 18px 0; }
  .langbar button { font-size: 0.95rem; padding: 7px 16px; margin: 3px; border-color: rgba(236, 228, 209, 0.22); color: var(--ivory-dim); }
  .langbar button:hover { border-color: var(--gold); background: transparent; color: var(--ivory); }
  .langbar button.on { background: var(--gold); border-color: var(--gold); color: #0a0a08; font-weight: 500; }
  section { background: linear-gradient(165deg, var(--panel), var(--night-2)); border: 1px solid rgba(212, 175, 90, 0.22); border-radius: 18px; padding: 20px; margin: 18px 0; }
  h2 { font-family: var(--serif); font-weight: 500; font-size: 1.6rem; line-height: 1.25; margin: 18px 0 8px; color: var(--ivory); }
  section > h2:first-child { margin-top: 0; color: var(--gold); }
  html[lang="ar"] h2 { font-family: var(--ar); font-weight: 400; }
  textarea, input[type=text], input[type=number], input[type=password] { width: 100%; font-family: var(--sans); font-size: 1rem; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(212, 175, 90, 0.22); background: rgba(7, 8, 13, 0.6); color: var(--ivory); margin: 4px 0; }
  textarea { min-height: 110px; font-family: var(--serif); font-size: 1.15rem; line-height: 1.4; }
  html[lang="ar"] textarea { font-family: var(--ar); }
  textarea:focus, input:focus, select:focus { outline: none; border-color: var(--gold); }
  textarea::placeholder, input::placeholder { color: var(--ivory-faint); }
  select { font-family: var(--sans); font-size: 1rem; padding: 10px; border-radius: 12px; border: 1px solid rgba(212, 175, 90, 0.22); background: var(--panel); color: var(--ivory); margin: 4px 0; }
  .verdict { font-family: var(--caps); font-size: 1.35rem; letter-spacing: 0.12em; padding: 12px 16px; border: 1.5px solid currentColor; border-radius: 6px; margin: 14px 0; }
  .verdict > div + div { font-family: var(--serif); letter-spacing: 0; color: var(--ivory); }
  html[lang="ar"] .verdict, html[lang="ar"] .verdict > div + div { font-family: var(--ar); letter-spacing: 0; }
  .danger { color: var(--danger); background: var(--danger-bg); }
  .unknown { color: var(--gold); background: rgba(212, 175, 90, 0.1); }
  .safe { color: var(--safe); background: var(--safe-bg); }
  .chip { display: inline-block; font-family: var(--sans); font-size: 0.95rem; font-weight: 400; letter-spacing: 0; padding: 2px 10px; margin: 4px 4px 0 0; border-radius: 999px; border: 1px solid currentColor; }
  .note { font-size: 0.9rem; color: var(--ivory-faint); }
  .row { margin: 6px 0; }
  label { display: block; margin: 8px 0; color: var(--ivory-dim); }
  li { color: var(--ivory-dim); margin: 4px 0; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0; }
  td { padding: 6px 4px; border-bottom: 1px solid rgba(212, 175, 90, 0.14); }
  td.t { font-weight: 500; }
  tr.next td { background: rgba(212, 175, 90, 0.12); color: var(--gold); }
  .cashrow { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(212, 175, 90, 0.14); }
  .in { color: var(--safe); } .out { color: var(--danger); }
  .songrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid rgba(212, 175, 90, 0.14); }
  .songrow span { overflow-wrap: anywhere; }
  audio { width: 100%; margin: 8px 0; }
  footer { text-align: center; margin: 32px 0 8px; color: var(--ivory-dim); }
  footer > div:first-child { font-family: var(--serif); font-style: italic; font-size: 1.35rem; color: var(--ivory); margin-bottom: 6px; }
  .licfoot { text-align: center; font-size: 0.8rem; color: var(--ivory-faint); margin: 6px 0 28px; }
  #lockOverlay { display: none; position: fixed; inset: 0; z-index: 99; background: rgba(7, 8, 13, 0.97); align-items: center; justify-content: center; }
  #lockOverlay.open { display: flex; }
  #lockBox { background: linear-gradient(165deg, var(--panel), var(--night-2)); border: 1px solid rgba(212, 175, 90, 0.3); border-radius: 18px; padding: 24px; max-width: 360px; width: 90%; text-align: center; }
  #lockBox h2 { font-family: var(--caps); font-weight: 400; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ivory); }
  #lockBox input { text-align: center; font-size: 1.4rem; letter-spacing: 0.4em; }
  .draftbanner { background: rgba(212, 175, 90, 0.14); color: var(--gold); border: 1px solid var(--gold-hair); border-radius: 12px; padding: 10px; text-align: center; margin: 12px 0; font-family: var(--caps); letter-spacing: 0.12em; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<div class="emblem"><img src="../icons/eye-256.webp" alt="" width="120" height="120"></div>
<h1>Satar</h1>
<p class="sub" data-t="sub"></p>
<div class="langbar">
  <button type="button" data-lang="ru" id="langRu">Русский</button>
  <button type="button" data-lang="ar" id="langAr">العربية</button>
  <button type="button" data-lang="en" id="langEn">English</button>
  <button type="button" data-lang="zh" id="langZh">中文</button>
</div>

<section>
  <h2 data-t="checkTitle"></h2>
  <p data-t="checkHint"></p>
  <textarea id="fwd" data-ph="checkPh"></textarea>
  <br>
  <button type="button" id="checkBtn" data-t="checkBtn"></button>
  <button type="button" id="hearBtn" data-t="hearBtn"></button>
  <div id="result"></div>
  <p class="note" data-t="checkNote"></p>
</section>

<section>
  <h2 data-t="localTitle"></h2>
  <p data-t="localIntro"></p>
  <div class="row"><span data-t="netLabel"></span> <span id="netStatus">—</span></div>
  <div class="row"><span data-t="inetLabel"></span> <span id="inetStatus">—</span></div>
  <div class="row"><span data-t="gpsLabel"></span> <span id="gpsStatus">—</span></div>
  <div id="badge" class="verdict unknown">—</div>
  <button type="button" id="testBtn" data-t="testBtn"></button>
  <button type="button" id="gpsBtn" data-t="gpsBtn"></button>
  <p class="note" data-t="localNote"></p>

  <h2 data-t="goLocal"></h2>
  <label><input type="checkbox"> <span data-t="step1"></span></label>
  <label><input type="checkbox"> <span data-t="step2"></span></label>
  <label><input type="checkbox"> <span data-t="step3"></span></label>
  <label><input type="checkbox"> <span data-t="step4"></span></label>

  <h2 data-t="mapsTitle"></h2>
  <p data-t="mapsText"></p>

  <h2 data-t="notesTitle"></h2>
  <textarea id="notes" data-ph="notesPh"></textarea>
  <br>
  <button type="button" id="saveNotesBtn" data-t="notesSave"></button>
  <span id="notesMsg"></span>

  <h2 data-t="limitsTitle"></h2>
  <ul>
    <li data-t="lim1"></li>
    <li data-t="lim2"></li>
    <li data-t="lim3"></li>
    <li data-t="lim4"></li>
  </ul>
</section>


<!-- CHRISTIAN-SECTION-START -->
<section id="christSection">
  <h2 data-t="cTitle"></h2>
  <div class="row"><span data-t="cDate"></span> <span id="cDateText">—</span></div>
  <div class="row"><span data-t="cLoc"></span> <span id="cLocText">—</span></div>
  <label><span data-t="cLat"></span> <input type="number" id="cLat" step="0.0001" value="30.0444"></label>
  <label><span data-t="cLon"></span> <input type="number" id="cLon" step="0.0001" value="31.2357"></label>
  <br>
  <button type="button" id="cGpsBtn" data-t="cGPS"></button>
  <button type="button" id="cCairoBtn" data-t="cCairo"></button>
  <button type="button" id="cCalcBtn" data-t="cCalc"></button>
  <table id="cTable"></table>
  <p class="note" data-t="cNote7"></p>
  <p class="note" data-t="cApprox"></p>
  <p class="note" data-t="cChurch"></p>
</section>
<!-- CHRISTIAN-SECTION-END -->

<section>
  <h2 data-t="voiceTitle"></h2>
  <p data-t="voiceText"></p>
  <button type="button" id="voiceTestBtn" data-t="voiceTest"></button>
</section>

<section>
  <h2 data-t="nbTitle"></h2>
  <p class="note" data-t="nbHint"></p>
  <label><span data-t="nbType"></span>
    <select id="nbType">
      <option value="in" data-t="nbIn"></option>
      <option value="out" data-t="nbOut"></option>
    </select>
  </label>
  <label><span data-t="nbAmt"></span> <input type="number" id="nbAmt" step="0.01" min="0" placeholder="0.00"></label>
  <label><span data-t="nbNote"></span> <input type="text" id="nbNote" data-ph="nbNotePh"></label>
  <br>
  <button type="button" id="nbAddBtn" data-t="nbAdd"></button>
  <div class="row"><span data-t="nbBal"></span> <b id="nbBal">0.00</b></div>
  <div id="nbList"></div>
  <p class="note" id="nbEmpty" data-t="nbEmpty"></p>
</section>

<section>
  <h2 data-t="lockTitle"></h2>
  <p data-t="lockText"></p>
  <label><span data-t="lockPass"></span> <input type="password" id="lockPass" inputmode="numeric" autocomplete="off" placeholder="••••"></label>
  <br>
  <button type="button" id="lockSetBtn" data-t="lockSet"></button>
  <button type="button" id="lockFaceBtn" data-t="lockFace" style="display:none"></button>
  <button type="button" id="lockNowBtn" data-t="lockNow"></button>
  <div class="row" id="lockMsg"></div>
  <p class="note" data-t="lockNote"></p>
</section>

<section>
  <h2 data-t="recTitle"></h2>
  <p data-t="recText"></p>
  <button type="button" id="recExportBtn" data-t="recExport"></button>
  <a id="recMailLink" href="#" style="display:none"><button type="button" data-t="recMail"></button></a>
  <a id="recSmsLink" href="#" style="display:none"><button type="button" data-t="recSms"></button></a>
  <div class="row" id="recMsg"></div>
  <p class="note" data-t="recAttach"></p>
  <label><span data-t="recImport"></span> <input type="file" id="recFile" accept=".json,application/json"></label>
  <div class="row" id="recImportMsg"></div>
</section>

<section>
  <h2 data-t="musTitle"></h2>
  <p data-t="musText"></p>
  <label><span data-t="musAdd"></span> <input type="file" id="musFile" accept="audio/*" multiple></label>
  <div class="row" id="musMsg"></div>
  <audio id="musPlayer" controls preload="none" style="display:none"></audio>
  <div id="musList"></div>
  <p class="note" id="musEmpty" data-t="musEmpty"></p>
  <p class="note" data-t="musNote"></p>

  <h2 data-t="freeTitle"></h2>
  <p data-t="freeText"></p>
  <button type="button" id="radioBtn" data-t="radioBtn"></button>
  <button type="button" id="radioStopBtn" class="small" data-t="radioStop" style="display:none"></button>
  <div class="row" id="radioNow"></div>
  <div id="freeList"></div>
  <p class="note" data-t="radioNote"></p>
</section>

<footer>
  <div>Made by Wyndham Heaven and Muse 3️⃣💡5️⃣</div>
  <div data-t="footFree"></div>
  <div data-t="footNothing"></div>
</footer>

<div class="licfoot">
  <div data-t="footLic"></div>
  <div data-t="footWarn"></div>
</div>

<div id="lockOverlay">
  <div id="lockBox">
    <div class="emblem"><img src="../icons/eye-256.webp" alt="" width="120" height="120"></div>
    <h2>Satar</h2>
    <p data-t="lockEnter"></p>
    <input type="password" id="unlockPass" inputmode="numeric" autocomplete="off" placeholder="••••">
    <br>
    <button type="button" id="unlockBtn" data-t="lockUnlock"></button>
    <button type="button" id="unlockFaceBtn" data-t="lockFace" style="display:none"></button>
    <div class="row" id="unlockMsg"></div>
    <p><a href="#" id="lockForgotLink" data-t="lockForgot"></a></p>
  </div>
</div>

function T(key) { var d = I18N[LANG] || I18N.en; return (d[key] !== undefined) ? d[key] : (I18N.en[key] || ''); }

function render() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = (LANG === 'ar') ? 'rtl' : 'ltr';
  var nodes = document.querySelectorAll('[data-t]');
  for (var i = 0; i < nodes.length; i++) {
    var k = nodes[i].getAttribute('data-t');
    nodes[i].textContent = T(k);
  }
  var phs = document.querySelectorAll('[data-ph]');
  for (var j = 0; j < phs.length; j++) {
    var pk = phs[j].getAttribute('data-ph');
    phs[j].placeholder = T(pk);
  }
  var opts = document.querySelectorAll('option[data-t]');
  for (var m = 0; m < opts.length; m++) {
    opts[m].textContent = T(opts[m].getAttribute('data-t'));
  }
  ['langRu', 'langAr', 'langEn', 'langZh'].forEach(function (id) { el(id).classList.remove('on'); });
  el(LANG === 'ru' ? 'langRu' : LANG === 'ar' ? 'langAr' : LANG === 'en' ? 'langEn' : 'langZh').classList.add('on');
  el('badge').textContent = T('badgeNew');
  renderCash();
}

function setLang(l) {
  LANG = l;
  try { localStorage.setItem('satar-lang', l); } catch (e) {}
  render();
  renderMusic();
}

function showVerdict(box, kind, title, reason, action) {
  box.className = 'verdict ' + kind;
  box.innerHTML = '<div>' + esc(title) + '</div>' +
    '<div style="font-size:1rem;font-weight:normal;margin-top:6px;">' + esc(reason) + '</div>' +
    '<div style="font-size:1rem;font-weight:normal;margin-top:6px;"><b>' + esc(T('whatToDo')) + '</b> ' + esc(action) + '</div>';
}

var PATTERNS = {
  code: [/code|otp|password|passcode/, /كود|رمز|كلمة السر|كلمة المرور/, /验证码|密码|口令/, /[Кк]од|[Пп]арол/],
  send: [/send|share|give|tell me/, /أرسل|ارسل|شارك|اعط|أعط|اخبر|أخبر/, /发送|分享|告诉|给我/, /[Оо]тправ|[Пп]оделись|[Сс]ообщи|[Пп]ришл/],
  link: [/https?:\/\/|www\./, /https?:\/\/|www\.|رابط/, /https?:\/\/|www\.|链接|网址/, /https?:\/\/|www\.|[Сс]сылк/],
  urgent: [/urgent|act now|immediately|account (locked|suspended|closed)|verify (now|immediately)|limited time|last chance/, /عاجل|فورا|فوراً|حسابك (مغلق|موقوف|معلق)|تحقق (الآن|فورا)|وقت محدود|فرصة أخيرة/, /紧急|立即|马上|账户(被锁定|被冻结|已关闭)|立即验证|限时|最后机会/, /[Сс]рочно|[Нн]емедленно|[Сс]ейчас же|аккаунт (заблокирован|заморожен|закрыт)|[Пп]одтверд(и|ите) (сейчас|немедленно)|ограниченное время|последний шанс/],
  money: [/send money|pay now|you (won|win)|prize|lottery|investment|double your money|bank account/, /أرسل مال|ادفع|ادفع الآن|ربحت|فزت|جائزة|يانصيب|استثمار|ضاعف مالك|حساب بنكي/, /汇款|付款|立即支付|你中奖了|中奖|彩票|投资|翻倍|银行账户/, /отправь деньги|заплат(и|ите) сейчас|вы (выиграли|победили)|приз|лотерея|инвестици|удво(й|ить) деньги|банковский сч[её]т/],
  act: [/tap|click|download|forward this|share this/, /اضغط|انقر|حمّل|حمل|أعد التوجيه|أعد الإرسال|شارك هذا/, /点击|下载|转发|分享/, /нажм|клик|скача|перешл|поделись этим/]
};

function matchAny(group, text, latinLower) {
  var pats = PATTERNS[group];
  for (var i = 0; i < pats.length; i++) {
    if (pats[i].test(text) || pats[i].test(latinLower)) return true;
  }
  return false;
}

var lastVerdictText = '';

// Latin, Cyrillic and Arabic letters: a match grows to its whole word.
// Chinese has no spaces, so a Chinese match stays as matched.
var WORD_CH = /[A-Za-z0-9_\u00C0-\u024F\u0400-\u04FF\u0610-\u061A\u0620-\u0669\u066E-\u06D3\u06D5-\u06FF]/;

function wholeWord(src, start, end, isUrl) {
  while (start > 0 && WORD_CH.test(src.charAt(start - 1))) start--;
  while (end < src.length && (isUrl ? !/\s/.test(src.charAt(end)) : WORD_CH.test(src.charAt(end)))) end++;
  var w = src.slice(start, end);
  return w.length > 60 ? w.slice(0, 57) + '...' : w;
}

function matchWords(group, text, latinLower, out) {
  var pats = PATTERNS[group];
  for (var i = 0; i < pats.length; i++) {
    var src = text, m = pats[i].exec(text);
    if (!m) { src = latinLower; m = pats[i].exec(latinLower); }
    if (!m) continue;
    var w = wholeWord(src, m.index, m.index + m[0].length, /^(https?:\/\/|www\.)/i.test(m[0]));
    if (w && out.indexOf(w) < 0) out.push(w);
  }
  return out;
}

function showWords(box, words) {
  if (!words.length) return;
  var d = document.createElement('div');
  d.style.cssText = 'font-size:1rem;font-weight:normal;margin-top:6px;';
  var b = document.createElement('b');
  b.textContent = T('whyWords') + ' ';
  d.appendChild(b);
  for (var i = 0; i < words.length; i++) {
    var s = document.createElement('span');
    s.className = 'chip';
    s.dir = 'auto';
    s.textContent = words[i];
    d.appendChild(s);
  }
  box.appendChild(d);
}

function checkForward() {
  var box = el('result');
  var text = el('fwd').value || '';
  var latinLower = text.toLowerCase();
  if (!text.trim()) {
    showVerdict(box, 'unknown', T('pasteFirst'), T('pasteFirstR'), T('pasteFirstA'));
    lastVerdictText = T('pasteFirst') + '. ' + T('pasteFirstR');
    return;
  }
  var hasCode = matchAny('code', text, latinLower);
  var asksSend = matchAny('send', text, latinLower);
  var hasLink = matchAny('link', text, latinLower);
  var urgent = matchAny('urgent', text, latinLower);
  var money = matchAny('money', text, latinLower);
  var act = matchAny('act', text, latinLower);
  var kind, title, reason, action, groups = [];
  if (hasCode && asksSend) {
    kind = 'danger'; title = T('vDanger'); reason = T('rCode'); action = T('aCode'); groups = ['code', 'send'];
  } else if (hasLink && urgent) {
    kind = 'danger'; title = T('vDanger'); reason = T('rLinkUrg'); action = T('aLinkUrg'); groups = ['link', 'urgent'];
  } else if (money) {
    kind = 'danger'; title = T('vDanger'); reason = T('rMoney'); action = T('aMoney'); groups = ['money'];
  } else if (hasLink || act) {
    kind = 'unknown'; title = T('vUnknown'); reason = T('rLink'); action = T('aLink'); groups = ['link', 'act'];
  } else {
    kind = 'safe'; title = T('vSafe'); reason = T('rSafe'); action = T('aSafe');
  }
  showVerdict(box, kind, title, reason, action);
  var words = [];
  for (var g = 0; g < groups.length; g++) matchWords(groups[g], text, latinLower, words);
  showWords(box, words);
  lastVerdictText = title + '. ' + reason + ' ' + action;
}

function speak(text) {
  try {
    if (!('speechSynthesis' in window)) return false;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = LANGS[LANG] || 'en-US';
    window.speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}

function setBadge(kind, text) {
  var b = el('badge');
  b.className = 'verdict ' + kind;
  b.textContent = text;
}

function testInternet() {
  // Asks this phone only. No request leaves it.
  var online = true;
  try {
    online = navigator.onLine !== false;
    el('netStatus').textContent = online ? T('netOnline') : T('netOffline');
  } catch (e) {
    el('netStatus').textContent = T('netUnavail');
  }
  if (online) {
    el('inetStatus').textContent = T('inetOn');
    setBadge('unknown', T('badgeOn'));
  } else {
    el('inetStatus').textContent = T('inetOff');
    setBadge('safe', T('badgeOff'));
  }
}

function showGPS() {
  try {
    if (!navigator.geolocation) {
      el('gpsStatus').textContent = T('gpsUnavail');
      return;
    }
    el('gpsStatus').textContent = T('gpsWait');
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        el('gpsStatus').textContent = 'Latitude ' + pos.coords.latitude.toFixed(5) +
          ', longitude ' + pos.coords.longitude.toFixed(5) +
          ' (accuracy about ' + Math.round(pos.coords.accuracy) + ' meters).';
      },
      function () {
        el('gpsStatus').textContent = T('gpsNeed');
      },
      { timeout: 10000 }
    );
  } catch (e) {
    el('gpsStatus').textContent = T('gpsFail');
  }
}

function loadNotes() {
  try {
    var saved = localStorage.getItem('satar-notes') || localStorage.getItem('fc-notes');
    if (saved) el('notes').value = saved;
  } catch (e) {}
}

function saveNotes() {
  try {
    localStorage.setItem('satar-notes', el('notes').value || '');
    el('notesMsg').textContent = T('notesSaved');
  } catch (e) {
    el('notesMsg').textContent = T('notesFail');
  }
}



function getCash() {
  try {
    var raw = localStorage.getItem('satar-cash');
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function saveCash(list) {
  try { localStorage.setItem('satar-cash', JSON.stringify(list)); } catch (e) {}
}

function renderCash() {
  var list = getCash();
  var bal = 0;
  var html = '';
  for (var i = list.length - 1; i >= 0; i--) {
    var it = list[i];
    var amt = Number(it.a) || 0;
    bal += (it.t === 'in' ? amt : -amt);
    html += '<div class="cashrow"><span>' + (it.t === 'in' ? '+' : '−') + ' ' + amt.toFixed(2) + ' — ' + esc(it.n || '') + ' <small>(' + esc(it.d || '') + ')</small></span>' +

function hashPass(pass) {
  function fallback() {
    var h1 = 5381, h2 = 52711;
    var s = 'satar:' + pass;
    for (var i = 0; i < s.length; i++) {
      h1 = ((h1 * 33) ^ s.charCodeAt(i)) >>> 0;
      h2 = ((h2 * 33) ^ (s.charCodeAt(i) + 7)) >>> 0;
    }
    return Promise.resolve('fb:' + h1.toString(16) + ':' + h2.toString(16));
  }
  try {
    if (window.crypto && crypto.subtle && window.isSecureContext) {
      var data = new TextEncoder().encode('satar:' + pass);
      return crypto.subtle.digest('SHA-256', data).then(function (buf) {
        var arr = Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('00' + b.toString(16)).slice(-2); });
        return arr.join('');
      }).catch(fallback);
    }
  } catch (e) {}
  return fallback();
}

function setupFace() {
  try {
    if (!window.PublicKeyCredential) { el('lockMsg').textContent = T('lockFaceNo'); return; }
    var challenge = new Uint8Array(32);
    (window.crypto || {}).getRandomValues ? crypto.getRandomValues(challenge) : challenge.forEach(function (v, i, a) { a[i] = Math.floor(Math.random() * 256); });
    var userId = new Uint8Array(16);
    try { crypto.getRandomValues(userId); } catch (e) { userId.forEach(function (v, i, a) { a[i] = Math.floor(Math.random() * 256); }); }
    navigator.credentials.create({
      publicKey: {
        challenge: challenge,
        rp: { name: 'Satar' },
        user: { id: userId, name: 'Satar', displayName: 'Satar' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000
      }
    }).then(function (cred) {
      try { localStorage.setItem('satar-face', cred.id); } catch (e) {}
      el('lockMsg').textContent = T('lockFaceOk');
    }).catch(function () {
      el('lockMsg').textContent = T('lockFaceNo');

}

function unlockWithFace(msgEl) {

    var challenge = new Uint8Array(32);
    try { crypto.getRandomValues(challenge); } catch (e) { challenge.forEach(function (v, i, a) { a[i] = Math.floor(Math.random() * 256); }); }
    navigator.credentials.get({
      publicKey: {
        challenge: challenge,
        allowCredentials: [{ id: Uint8Array.from(atob(credId.replace(/-/g, '+').replace(/_/g, '/')), function (c) { return c.charCodeAt(0); }), type: 'public-key' }],
        userVerification: 'required',
        timeout: 60000
      }
    }).then(function () {
      hideLockOverlay();

var musDB = null;
var musURL = null;

function musOpen(cb) {
  if (musDB) { cb(musDB); return; }
  try {
    if (!window.indexedDB) { cb(null); return; }
    var req = indexedDB.open('satar-music', 1);
    req.onupgradeneeded = function () {
      var db = req.result;
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'id', autoIncrement: true });
      if (!db.objectStoreNames.contains('data')) db.createObjectStore('data');
    };
    req.onsuccess = function () { musDB = req.result; cb(musDB); };
    req.onerror = function () { cb(null); };
  } catch (e) { cb(null); }
}

function musAdd(files) {
  musOpen(function (db) {
    if (!db) { el('musMsg').textContent = T('musNo'); return; }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    var added = 0, failed = 0;
    (function next() {
      if (!files.length) {
        var msg = T('musAdded').replace('{n}', added);
        if (failed) msg += ' ' + T('musFail');
        el('musMsg').textContent = msg;
        renderMusic();
        return;
      }
      var f = files.shift();
      if (f.type && f.type.indexOf('audio/') !== 0) { failed++; next(); return; }
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var tx = db.transaction(['meta', 'data'], 'readwrite');
          var r = tx.objectStore('meta').add({ name: f.name, type: f.type || 'audio/mpeg', size: f.size, added: new Date().toISOString().slice(0, 10) });
          r.onsuccess = function () { tx.objectStore('data').put(reader.result, r.result); };
          tx.oncomplete = function () { added++; next(); };
          tx.onabort = function () { failed++; next(); };
        } catch (e) { failed++; next(); }
      };
      reader.onerror = function () { failed++; next(); };
      reader.readAsArrayBuffer(f);
    })();
  });
}

function musButton(key, fn) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'small';
  b.setAttribute('data-t', key);

function renderMusic() {
  musOpen(function (db) {
    if (!db) { el('musEmpty').style.display = 'block'; renderFree([]); return; }
    var items = [];

      var cur = db.transaction('meta', 'readonly').objectStore('meta').openCursor();
      cur.onsuccess = function () {
        var c = cur.result;
        if (c) { items.push(c.value); c['continue'](); return; }
        var box = el('musList');
        box.textContent = '';
        items.forEach(function (s) {
          var row = document.createElement('div');
          row.className = 'songrow';
          var name = document.createElement('span');
          name.dir = 'auto';
          name.textContent = s.name;
          var btns = document.createElement('span');
          btns.appendChild(musButton('musPlay', function () { musPlay(s.id, s.name); }));
          btns.appendChild(musButton('musDel', function () { musDelete(s.id); }));
          row.appendChild(name);
          row.appendChild(btns);
          box.appendChild(row);
        });
        el('musEmpty').style.display = items.length ? 'none' : 'block';
        renderFree(items);
      };
    } catch (e) {}
  });
}

function musAll(cb) {
  musOpen(function (db) {
    if (!db) { cb([]); return; }

      var cur = db.transaction('meta', 'readonly').objectStore('meta').openCursor();

function keptId(items, freeId) {
  for (var i = 0; i < items.length; i++) if (items[i].free === freeId) return items[i].id;
  return null;
}

function freeItem(s, items) {
  var id = keptId(items, s.id);
  return id !== null ? { idb: id, name: freeTitle(s) } : { url: '../music/' + s.id + '.mp3', name: freeTitle(s) };
}

function keepFree(s) {
  fetch('../music/' + s.id + '.mp3').then(function (r) {
    if (!r.ok) throw new Error('not ok');
    return r.arrayBuffer();
  }).then(function (buf) {
    musOpen(function (db) {
      if (!db) { el('musMsg').textContent = T('musNo'); return; }
      try {
        var tx = db.transaction(['meta', 'data'], 'readwrite');
        var r = tx.objectStore('meta').add({ name: '♪ ' + freeTitle(s), type: 'audio/mpeg', size: buf.byteLength, added: new Date().toISOString().slice(0, 10), free: s.id });
        r.onsuccess = function () { tx.objectStore('data').put(buf, r.result); };
        tx.oncomplete = function () { el('musMsg').textContent = T('musKept'); renderMusic(); };
        tx.onabort = function () { el('musMsg').textContent = T('musFail'); };
      } catch (e) { el('musMsg').textContent = T('musFail'); }
    });
  }).catch(function () { el('musMsg').textContent = T('musNeedNet'); });
}

function playItem(item) {
  var p = el('musPlayer');
  function start(src) {
    if (musURL) { URL.revokeObjectURL(musURL); musURL = null; }
    if (src.blob) { musURL = URL.createObjectURL(src.blob); p.src = musURL; } else { p.src = src.url; }
    p.style.display = 'block';
    el('radioNow').textContent = item.name ? T('radioNow') + ' ' + item.name : '';
    var pr = p.play();
    if (pr && pr.catch) pr.catch(function () {});
  }
  if (item.url) { start({ url: item.url }); return; }
  musOpen(function (db) {
    if (!db) return;
    try {
      var tx = db.transaction(['meta', 'data'], 'readonly');
      var m = tx.objectStore('meta').get(item.idb);
      var d = tx.objectStore('data').get(item.idb);
      tx.oncomplete = function () {
        if (!m.result || !d.result) { radioNext(); return; }
        start({ blob: new Blob([d.result], { type: m.result.type }) });
      };
    } catch (e) {}
  });
}

function radioStart() {
  musAll(function (items) {
    var q = [];
    var online = navigator.onLine !== false;
    FREE.forEach(function (s) {
      var it = freeItem(s, items);
      if (it.idb !== undefined || online) q.push(it);
    });
    items.forEach(function (m) { if (!m.free) q.push({ idb: m.id, name: m.name }); });
    if (!q.length) { radioStop(); el('radioNow').textContent = T('radioEmpty'); return; }
    for (var i = q.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var x = q[i]; q[i] = q[j]; q[j] = x;
    }
    radioQueue = q; radioPos = 0; radioFails = 0; radioOn = true;
    el('radioStopBtn').style.display = '';
    playItem(radioQueue[0]);
  });
}

function radioNext() {
  if (!radioOn) return;
  radioPos++;
  if (radioPos >= radioQueue.length) { radioStart(); return; }
  playItem(radioQueue[radioPos]);
}

function radioStop() {
  radioOn = false;
  el('radioStopBtn').style.display = 'none';
}

function musDelete(id) {
  musOpen(function (db) {
    if (!db) return;
    try {
      var tx = db.transaction(['meta', 'data'], 'readwrite');
      tx.objectStore('meta')['delete'](id);
      tx.objectStore('data')['delete'](id);
      tx.oncomplete = renderMusic;
    } catch (e) {}
  });
}

function phoneZone() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; }

function phonePlace() {
  var z = phoneZone();
  if (PHONE_TZ_POINT[z]) return { lat: PHONE_TZ_POINT[z][0], lon: PHONE_TZ_POINT[z][1] };
  // Unknown zone: longitude from the standard (winter) UTC offset, a middle latitude.
  var y = new Date().getFullYear();
  var std = Math.min(-new Date(y, 0, 1).getTimezoneOffset(), -new Date(y, 6, 1).getTimezoneOffset());
  return { lat: 25, lon: Math.max(-180, Math.min(180, std / 4)) };
}

function savedPlace() {

    if (loc && (loc.src === 'gps' || loc.src === 'manual') && loc.tz === phoneZone() && isFinite(loc.lat) && isFinite(loc.lon)) return loc;
  } catch (e) {}

}

var placeSrcC = 'tz';
function computeSunTimes(dateObj, lat, lon, tzMin) {
  function toRad(d) { return d * Math.PI / 180; }

  var L0R = toRad(L0);
  var eqTime = 4 * toDeg(y2 * Math.sin(2 * L0R) - 2 * e * Math.sin(Mr) + 4 * e * y2 * Math.sin(Mr) * Math.cos(2 * L0R) - 0.5 * y2 * y2 * Math.sin(4 * L0R) - 1.25 * e * e * Math.sin(2 * Mr));

function fmtMin(m) { m = ((Math.floor(m) % 1440) + 1440) % 1440; var h = Math.floor(m / 60), mm = m % 60; return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm; }
function calcChristian() {
  if (!el('cLat') || !el('cLon') || !el('cTable')) return;

  var lon = parseFloat(el('cLon').value);
  if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) { el('cLocText').textContent = '—'; el('cTable').innerHTML = ''; return; }
  var today = new Date();
  var noonToday = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 12, 0, 0);
  var tzMin = -noonToday.getTimezoneOffset();
  var st = computeSunTimes(today, lat, lon, tzMin);
  el('cDateText').textContent = today.getFullYear() + '-' + (today.getMonth() + 1) + '-' + today.getDate();
  el('cLocText').textContent = lat.toFixed(4) + ', ' + lon.toFixed(4) + ' (UTC' + (tzMin >= 0 ? '+' : '') + (tzMin / 60) + ')';
  if (!st) { el('cTable').innerHTML = ''; return; }

  var h = '';
  for (var i = 0; i < rows.length; i++) { h += '<tr><td><span data-t="' + rows[i][0] + '"></span></td><td>' + fmtMin(rows[i][1]) + '</td></tr>'; }

function useGpsForChristian() {
